[package]
name = "game-registry"
version = "0.0.1"
description = "x1-games Game Registry program — game IDs, attestor keys, allowed models"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "game_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.0.2"
