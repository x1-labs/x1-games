[features]
resolution = true
skip-lint = false

[programs.localnet]
match_program = "kPnK69DwUAmEobyLiWNNmra6STdJLFszJxc314XkEKb"
game_registry = "92NzjeGS2kEuLw53vAvox6eFdNfT2VoSTrSX4uGTHKbS"
xp_ledger = "E4ccwzzHoLeziC4S7so55etspU6Ag6zrGNERKhSuaD74"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Drive mocha programmatically from a bun-executed runner. Guarantees bun is
# the interpreter (not Node via mocha's shebang) so TypeScript loads natively
# everywhere — sidesteps the ts-node/ts-mocha ESM-vs-CJS dance entirely.
test = "bun tests/_runner.ts"

[test]
startup_wait = 10000
