<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#374151"/>
    </marker>
    <marker id="arr-soft" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#2E7D6B"/>
    </marker>
  </defs>

  <rect width="1240" height="980" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="620" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">Solo Game Flow — Single Player vs House</text>
  <text x="620" y="60" text-anchor="middle" font-size="13" fill="#6B7280">OPTIMISTIC attestation. Server-authoritative simulation. Stake 5 XNT, house prize 50 XNT, rake 3%.</text>

  <!-- Lane backgrounds (full height) -->
  <rect x="40"   y="80" width="280" height="860" fill="#FDF7EC"/>
  <rect x="320"  y="80" width="280" height="860" fill="#FDF7EC"/>
  <rect x="600"  y="80" width="280" height="860" fill="#FDF7EC"/>
  <rect x="880"  y="80" width="320" height="860" fill="#EFF8F4"/>

  <!-- Lane header strips -->
  <rect x="40"  y="80" width="280" height="44" fill="#FBF1E1" stroke="#B8772A" stroke-width="1.5"/>
  <rect x="320" y="80" width="280" height="44" fill="#FBF1E1" stroke="#B8772A" stroke-width="1.5"/>
  <rect x="600" y="80" width="280" height="44" fill="#FBF1E1" stroke="#B8772A" stroke-width="1.5"/>
  <rect x="880" y="80" width="320" height="44" fill="#E3F1ED" stroke="#2E7D6B" stroke-width="1.5"/>

  <text x="180"  y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">Player</text>
  <text x="180"  y="119" text-anchor="middle" font-size="11" fill="#6B7280">wallet · off-chain</text>
  <text x="460"  y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">Game Client</text>
  <text x="460"  y="119" text-anchor="middle" font-size="11" fill="#6B7280">browser · off-chain</text>
  <text x="740"  y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">Game Server</text>
  <text x="740"  y="119" text-anchor="middle" font-size="11" fill="#6B7280">canonical sim · attestor · off-chain</text>
  <text x="1040" y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">X1 Chain</text>
  <text x="1040" y="119" text-anchor="middle" font-size="11" fill="#6B7280">Match / Vault / XP / Treasury — on-chain</text>

  <!-- Lifelines -->
  <line x1="180"  y1="124" x2="180"  y2="940" stroke="#B8772A" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <line x1="460"  y1="124" x2="460"  y2="940" stroke="#B8772A" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <line x1="740"  y1="124" x2="740"  y2="940" stroke="#B8772A" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <line x1="1040" y1="124" x2="1040" y2="940" stroke="#2E7D6B" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/>

  <!-- =================================================================== -->
  <!-- Step 1: Player → Client : launch + bet -->
  <g>
    <circle cx="180" cy="160" r="11" fill="#374151"/>
    <text x="180" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
    <line x1="194" y1="160" x2="446" y2="160" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="320" y="153" text-anchor="middle" font-size="12" fill="#1F2937">launch · select wager (5 XNT)</text>
  </g>

  <!-- Step 2: Client → Server : request solo match -->
  <g>
    <circle cx="460" cy="210" r="11" fill="#374151"/>
    <text x="460" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
    <line x1="474" y1="210" x2="726" y2="210" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="600" y="203" text-anchor="middle" font-size="12" fill="#1F2937">requestSoloMatch(stake=5, prize=50)</text>
  </g>

  <!-- Step 3: Server → Chain : createMatch -->
  <g>
    <circle cx="740" cy="260" r="11" fill="#2E7D6B"/>
    <text x="740" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
    <line x1="754" y1="260" x2="1026" y2="260" stroke="#2E7D6B" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="890" y="253" text-anchor="middle" font-size="12" font-weight="500" fill="#1F2937">createMatch(seats=1, stake=5, housePrize=50, OPTIMISTIC)</text>
    <text x="890" y="276" text-anchor="middle" font-size="10" font-style="italic" fill="#2E7D6B">tx · house funds Vault PDA with 50 XNT</text>
  </g>

  <!-- On-chain side note: Match PDA + Vault PDA created -->
  <g>
    <rect x="892" y="294" width="296" height="36" rx="4" fill="#FFFFFF" stroke="#2E7D6B" stroke-width="1"/>
    <text x="1040" y="309" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Match PDA created · state = FUNDED (house side)</text>
    <text x="1040" y="324" text-anchor="middle" font-size="10" fill="#6B7280">Vault PDA holds 50 XNT</text>
  </g>

  <!-- Step 4: Chain → Server (dashed, event/return) -->
  <g>
    <circle cx="1040" cy="355" r="11" fill="#9CA3AF"/>
    <text x="1040" y="359" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text>
    <line x1="1026" y1="355" x2="754" y2="355" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arr-soft)" stroke-dasharray="5 3"/>
    <text x="890" y="348" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7280">matchId returned</text>
  </g>

  <!-- Step 5: Server → Player : prompt deposit (long arrow back) -->
  <g>
    <circle cx="740" cy="405" r="11" fill="#374151"/>
    <text x="740" y="409" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">5</text>
    <line x1="726" y1="405" x2="194" y2="405" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="460" y="398" text-anchor="middle" font-size="12" fill="#1F2937">prompt: sign joinMatch deposit tx</text>
  </g>

  <!-- Step 6: Player → Chain : joinMatch (deposit) -->
  <g>
    <circle cx="180" cy="455" r="11" fill="#2E7D6B"/>
    <text x="180" y="459" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">6</text>
    <line x1="194" y1="455" x2="1026" y2="455" stroke="#2E7D6B" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="610" y="448" text-anchor="middle" font-size="12" font-weight="500" fill="#1F2937">joinMatch — deposit 5 XNT to Vault PDA</text>
    <text x="610" y="471" text-anchor="middle" font-size="10" font-style="italic" fill="#2E7D6B">tx · player signs</text>
  </g>

  <!-- On-chain state note: LIVE -->
  <g>
    <rect x="942" y="488" width="196" height="22" rx="4" fill="#E3F1ED" stroke="#2E7D6B" stroke-width="1"/>
    <text x="1040" y="503" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">Match → LIVE</text>
  </g>

  <!-- Step 7: Server → Client : start session -->
  <g>
    <circle cx="740" cy="540" r="11" fill="#374151"/>
    <text x="740" y="544" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">7</text>
    <line x1="726" y1="540" x2="474" y2="540" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="600" y="533" text-anchor="middle" font-size="12" fill="#1F2937">start session · seed · tick rate</text>
  </g>

  <!-- Step 8: Play loop box across Player/Client/Server -->
  <g>
    <rect x="100" y="575" width="700" height="78" rx="8" fill="#FBF1E1" stroke="#B8772A" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="120" cy="595" r="11" fill="#374151"/>
    <text x="120" y="599" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">8</text>
    <text x="450" y="600" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">play loop (off-chain, server-authoritative)</text>
    <text x="450" y="620" text-anchor="middle" font-size="11" fill="#374151">Player → inputs → Game Client → input stream → Game Server</text>
    <text x="450" y="638" text-anchor="middle" font-size="11" fill="#374151">Server runs canonical simulator · client only renders</text>
  </g>

  <!-- Step 9: Server self-action: compute & sign outcome -->
  <g>
    <circle cx="740" cy="685" r="11" fill="#374151"/>
    <text x="740" y="689" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">9</text>
    <path d="M 740 685 q 70 0 70 24 q 0 24 -70 24" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="826" y="713" font-size="11" fill="#1F2937">compute outcome · sign · hash replay</text>
  </g>

  <!-- Step 10: Server → Chain : post_outcome -->
  <g>
    <circle cx="740" cy="755" r="11" fill="#2E7D6B"/>
    <text x="740" y="759" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">10</text>
    <line x1="754" y1="755" x2="1026" y2="755" stroke="#2E7D6B" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="890" y="748" text-anchor="middle" font-size="12" font-weight="500" fill="#1F2937">post_outcome(winner, payout, replayHash, sig)</text>
    <text x="890" y="771" text-anchor="middle" font-size="10" font-style="italic" fill="#2E7D6B">tx</text>
  </g>

  <!-- On-chain note: challenge window -->
  <g>
    <rect x="892" y="790" width="296" height="36" rx="4" fill="#FFFFFF" stroke="#2E7D6B" stroke-width="1"/>
    <text x="1040" y="805" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2937">challenge window opens (e.g. 1h)</text>
    <text x="1040" y="820" text-anchor="middle" font-size="10" fill="#6B7280">anyone may submit a contradicting replay segment</text>
  </g>

  <!-- Step 11: Chain self : finalize after window -->
  <g>
    <circle cx="1040" cy="855" r="11" fill="#2E7D6B"/>
    <text x="1040" y="859" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">11</text>
    <path d="M 1040 855 q 70 0 70 18 q 0 18 -70 18" fill="none" stroke="#2E7D6B" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="1126" y="877" font-size="11" fill="#1F2937">finalize_match · settle</text>
  </g>

  <!-- Step 12: Chain → Player : payout (and side notes for rake + XP) -->
  <g>
    <circle cx="1040" cy="915" r="11" fill="#2E7D6B"/>
    <text x="1040" y="919" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">12</text>
    <line x1="1026" y1="915" x2="194" y2="915" stroke="#2E7D6B" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="600" y="908" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">payout 53.35 XNT (pot 55 − 3% rake)</text>
    <text x="600" y="930" text-anchor="middle" font-size="10" font-style="italic" fill="#2E7D6B">atomic: + rake to Treasury · + XP credit to Player</text>
  </g>

  <!-- Legend (bottom right corner) -->
  <g>
    <rect x="40" y="954" width="1160" height="0" fill="none"/>
    <line x1="60" y1="965" x2="86" y2="965" stroke="#2E7D6B" stroke-width="1.8"/>
    <text x="92" y="969" font-size="10" fill="#6B7280">on-chain tx</text>
    <line x1="172" y1="965" x2="198" y2="965" stroke="#374151" stroke-width="1.8"/>
    <text x="204" y="969" font-size="10" fill="#6B7280">off-chain message</text>
    <line x1="298" y1="965" x2="324" y2="965" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="330" y="969" font-size="10" fill="#6B7280">event / async return</text>
    <text x="1198" y="969" text-anchor="end" font-size="10" fill="#9CA3AF">x1-games whitepaper v0.3 — 2026-05-12</text>
  </g>
</svg>
